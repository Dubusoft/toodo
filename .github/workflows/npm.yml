name: npm

# Builds and publishes the npm packages @dubusoft/toodo (the launcher and the web app) and
# the platform packages @dubusoft/toodo-linux-x64 and @dubusoft/toodo-linux-arm64
# (the toodo and toodo-server binaries).
#
# Two channels:
# - dev: every push to dev publishes a prerelease "<next patch>-dev.<run number>" under the
#   dist-tag "dev" (npm install -g @dubusoft/toodo@dev).
# - latest: the Release workflow calls this workflow after a push to main and publishes the
#   package.json version under the dist-tag "latest". A version that is already on the
#   registry is skipped, so re-running finishes a half-done publish.
#
# Publishing authenticates with the NPM_TOKEN secret when it is set, otherwise with npm
# trusted publishing (OIDC) when it is configured on npmjs.com for all three packages
# (repository dev-bokdong/toodo, workflow npm.yml). When neither is available the workflow
# only prints a notice and succeeds.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      dist-tag:
        description: Channel to publish to, dev or latest
        type: string
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the version, dist-tag, and publish mode
        id: plan
        env:
          # A push to dev and a manual run on dev publish the dev channel; the Release
          # workflow passes "latest".
          INPUT_TAG: ${{ inputs.dist-tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          tag="${INPUT_TAG:-dev}"
          case "$tag" in
            dev|latest) ;;
            *) echo "::error::dist-tag must be dev or latest, got '$tag'; rerun with dist-tag dev or latest"; exit 1 ;;
          esac
          base=$(jq -r .version package.json)
          if [ "$tag" = latest ]; then
            version="$base"
          else
            IFS=. read -r major minor patch <<<"${base%%[-+]*}"
            version="$major.$minor.$((patch + 1))-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "dist-tag=$tag" >>"$GITHUB_OUTPUT"

          if [ "$tag" = latest ] && [ -n "$(npm view "@dubusoft/toodo@$version" version 2>/dev/null)" ]; then
            echo "::notice::@dubusoft/toodo@$version is already on the registry; nothing to publish."
            echo "mode=skip" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          mode=skip
          if [ -n "$NPM_TOKEN" ]; then
            mode=token
          else
            # Trusted publishing must work for every package, or a publish would stop halfway.
            id_token=
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              id_token=$(curl -fsS "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
                -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r .value || true)
            fi
            if [ -n "$id_token" ] && [ "$id_token" != null ]; then
              mode=oidc
              for name in @dubusoft/toodo @dubusoft/toodo-linux-x64 @dubusoft/toodo-linux-arm64; do
                code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                  "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name//\//%2F}" \
                  -H "Authorization: Bearer $id_token" || true)
                case "$code" in
                  2??) ;;
                  *) echo "trusted publishing check for $name returned HTTP ${code:-none}"; mode=skip ;;
                esac
              done
            fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          if [ "$mode" = skip ]; then
            echo "::notice::Publishing is skipped: set the NPM_TOKEN secret, or configure trusted publishing on npmjs.com for @dubusoft/toodo, @dubusoft/toodo-linux-x64, and @dubusoft/toodo-linux-arm64 (repository dev-bokdong/toodo, workflow npm.yml), then rerun this workflow."
          fi
          echo "version=$version dist-tag=$tag mode=$mode"

  build:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            # The oldest supported runners, so the binaries link against an old glibc and
            # run on current Debian and Ubuntu LTS releases too.
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: npm-${{ matrix.target }}

      - name: Build toodo and toodo-server
        working-directory: src-tauri
        run: cargo build --release --locked --bin toodo --bin toodo-server

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            src-tauri/target/release/toodo
            src-tauri/target/release/toodo-server
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships a recent enough npm,
      # this keeps it that way if the bundled npm is older.
      - name: Ensure npm supports trusted publishing
        run: |
          current=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != 11.5.1 ]; then
            npm install -g npm@latest
          fi

      - run: npm ci

      - name: Build the web app
        run: npm run build

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: artifacts

      - name: Stage the packages
        id: stage
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          chmod +x artifacts/*/toodo artifacts/*/toodo-server
          node scripts/package-npm.mjs --version "$VERSION" --web dist-web --out dist-npm \
            --binaries linux-x64=artifacts/binaries-linux-x64 \
            --binaries linux-arm64=artifacts/binaries-linux-arm64 >dirs.txt
          cat dirs.txt

      - name: Publish the packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ needs.plan.outputs.mode == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          # Platform packages come first, the main package last, so an install never
          # resolves a main package whose platform package is missing.
          while read -r dir; do
            [ -n "$dir" ] || continue
            name=$(jq -r .name "$dir/package.json")
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is already published; skipping"
              continue
            fi
            npm publish "$dir" --access public --provenance --tag "$DIST_TAG"
          done <dirs.txt
